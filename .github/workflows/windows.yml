name: Build Windows desktop app
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build windows --release
      - name: Package Windows installer
        id: version
        shell: pwsh
        run: |
          $version = ([regex]::Match((Get-Content pubspec.yaml -Raw), '(?m)^version: (\d+\.\d+\.\d+)')).Groups[1].Value
          "version=$version" >> $env:GITHUB_OUTPUT
          ./tool/windows/package.ps1 -Version $version
      - name: Verify per-user installation
        shell: pwsh
        run: |
          $appDir = Join-Path $env:RUNNER_TEMP 'Stillword-install-check'
          $setup = Start-Process ./build/installer/Stillword-Windows-Setup.exe -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$appDir`"") -WindowStyle Hidden -Wait -PassThru
          if ($setup.ExitCode -ne 0) { throw "Installer failed: $($setup.ExitCode)" }
          try {
            if (-not (Test-Path "$appDir/stillword.exe")) { throw 'Missing desktop executable' }
            if (-not (Test-Path "$appDir/flutter_local_notifications_windows.dll")) { throw 'Missing notification plugin' }
            $callback = (Get-Item 'HKCU:/Software/Classes/CLSID/{b4c2eb75-665d-4cb9-9a02-321f5ec40b47}/LocalServer32').GetValue('')
            if ($callback -ne "`"$appDir\stillword.exe`" -ToastActivated") { throw 'Incorrect notification activation registration' }
          } finally {
            $uninstall = Start-Process "$appDir/unins000.exe" -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -WindowStyle Hidden -Wait -PassThru
            if ($uninstall.ExitCode -ne 0) { throw 'Uninstaller failed' }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Stillword-windows
          path: build/installer/*
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-native-validation
          path: build/windows/x64/runner/Release/
          retention-days: 3
      - name: Publish Windows preview
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Stillword ${{ steps.version.outputs.version }} for Windows
          prerelease: true
          body: |
            Free Windows 10 (2004+) / Windows 11 x64 preview.
            Download Stillword-Windows-Setup.exe and install for your Windows account.
            Choose morning, afternoon, and night reminders in Rhythm, then send a test notification.
            Windows keeps scheduled reminders after closing the window. Keep your PC on and awake, and reopen Stillword at least every 20 days to refill the queue.
            This preview installer is unsigned; Windows may identify the publisher as unknown.
            Bookmarks and reading history stay on this device. The 365-reading sequence does not automatically repeat.
          files: |
            build/installer/Stillword-Windows-Setup.exe
            build/installer/SHA256SUMS.txt
            build/installer/windows-release.json
